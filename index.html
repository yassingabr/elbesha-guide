<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البسها — دليل اللعبة</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #FF2D1A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #CC1500;
      margin-bottom: 8px;
    }

    .title {
      font-size: 52px;
      font-weight: 900;
      color: #1A1A1A;
      line-height: 1;
      margin-bottom: 4px;
      font-style: italic;
    }

    .subtitle {
      font-size: 15px;
      color: #888;
      margin-bottom: 32px;
      font-weight: 500;
    }

    .btn {
      display: block;
      background: #FF2D1A;
      color: #fff;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover {
      background: #CC1500;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f4f4f4;
      color: #1A1A1A;
    }

    .btn-secondary:hover {
      background: #e8e8e8;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #bbb;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .kk-mark {
      display: inline-block;
      background: #FF2D1A;
      color: #fff;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="kk-mark">KK</div>
    <div class="brand">Khod Kart</div>
    <div class="title">البسها!</div>
    <div class="subtitle">دليل اللعبة — Game Guide</div>

    <a href="guide.pdf" class="btn" target="_blank">
      📖 افتح الدليل — Open Guide
    </a>
    <a href="guide.pdf" download class="btn btn-secondary">
      ⬇️ تحميل — Download PDF
    </a>

    <div class="footer">khodkart.com</div>
  </div>
</body>
</html>
